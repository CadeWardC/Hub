name: Build 365 iOS app

on:
  push:
    branches: [main]
    paths:
      - "365-iOS/**"
      - ".github/workflows/365-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 365-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: 365-iOS
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -version
          xcodebuild build \
            -project ThreeSixtyFive.xcodeproj \
            -scheme ThreeSixtyFive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"

      - name: Package IPA
        run: |
          set -euo pipefail
          app=build/DerivedData/Build/Products/Release-iphoneos/ThreeSixtyFive.app
          # Ad-hoc signature carries the Time Sensitive entitlement, so sideloading tools re-sign with it.
          codesign --force --sign - --entitlements App/ThreeSixtyFive.entitlements "$app"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry ../365.ipa Payload)
          ls -lh build/365.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 365-ipa
          path: 365-iOS/build/365.ipa
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: 365-iOS/build/xcodebuild.log

      - name: Publish to the 365 iOS release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=365-ios
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "365 for iOS" --notes "Unsigned IPA of 365, the daily hair-growth photo tracker. Install it with AltStore, SideStore or Sideloadly. Rebuilt automatically on every change." --latest=false
          fi
          gh release upload "$tag" build/365.ipa --clobber
