name: Build ToneTalk iOS app

on:
  push:
    branches: [main]
    paths:
      - "ToneTalk-iOS/**"
      - ".github/workflows/tonetalk-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tonetalk-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ToneTalk-iOS
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test the tone engine
        working-directory: ToneTalk-iOS/ToneKit
        run: |
          set -uo pipefail
          swift test -c release -Xswiftc -enable-testing 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          grep -E "error:|XCTAssert" test.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          exit "$status"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -uo pipefail
          mkdir -p build
          xcodebuild -version
          xcodebuild build \
            -project ToneTalk.xcodeproj \
            -scheme ToneTalk \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1
          status=$?
          grep -E "error:" build/xcodebuild.log | sort -u | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "BUILD (SUCCEEDED|FAILED)" build/xcodebuild.log
          exit "$status"

      - name: Package IPA
        run: |
          set -euo pipefail
          app=build/DerivedData/Build/Products/Release-iphoneos/ToneTalk.app
          codesign --force --sign - "$app"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry ../ToneTalk.ipa Payload)
          ls -lh build/ToneTalk.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToneTalk-ipa
          path: ToneTalk-iOS/build/ToneTalk.ipa
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ToneTalk-iOS/build/xcodebuild.log

      - name: Publish to the ToneTalk iOS release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=tonetalk-ios
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "ToneTalk for iOS" --notes "Unsigned IPA of ToneTalk: speak Mandarin, get a spoken reply from DeepSeek or Kimi, and a pitch-based tone check on every syllable, with a hands-free mode. Install it with AltStore, SideStore or Sideloadly, then add your own API key in Settings. Rebuilt automatically on every change." --latest=false
          fi
          gh release upload "$tag" build/ToneTalk.ipa --clobber
