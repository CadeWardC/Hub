name: Build ManDayRin iOS app

on:
  push:
    branches: [main]
    paths:
      - "ManDayRin/**"
      - "ManDayRin-iOS/**"
      - ".github/workflows/mandayrin-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mandayrin-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ManDayRin-iOS
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bundle the web app and course data
        run: bash scripts/prepare.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild build \
            -project ManDayRin.xcodeproj \
            -scheme ManDayRin \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"

      - name: Package IPA
        run: |
          set -euo pipefail
          app=build/DerivedData/Build/Products/Release-iphoneos/ManDayRin.app
          test -d "$app/PlugIns/ManDayRinWidget.appex"
          # Ad-hoc signatures carry the App Group entitlement, so sideloading tools re-sign with it.
          codesign --force --sign - --entitlements Widget/ManDayRinWidget.entitlements "$app/PlugIns/ManDayRinWidget.appex"
          codesign --force --sign - --entitlements App/ManDayRin.entitlements "$app"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry ../ManDayRin.ipa Payload)
          ls -lh build/ManDayRin.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManDayRin-ipa
          path: ManDayRin-iOS/build/ManDayRin.ipa
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ManDayRin-iOS/build/xcodebuild.log

      - name: Publish to the ManDayRin iOS release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=mandayrin-ios
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "ManDayRin for iOS" --notes "Unsigned IPA of ManDayRin with its Lock Screen widget. Install it with AltStore, SideStore or Sideloadly. Rebuilt automatically on every change." --latest=false
          fi
          gh release upload "$tag" build/ManDayRin.ipa --clobber
