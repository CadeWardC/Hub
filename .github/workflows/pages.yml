name: Build and deploy Hub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Assemble safe static artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html script.js styles.css _site/
          for project in ManDayRin conversions hollowkeep laser-engraving md2pdf paypers smolov; do
            cp -R "$project" "_site/$project"
          done
          python3 StoryTime/build_stories.py
          mkdir -p _site/StoryTime
          cp StoryTime/*.html StoryTime/*.js StoryTime/*.css StoryTime/*.webmanifest StoryTime/*.svg StoryTime/*.png _site/StoryTime/
          if [ -d StoryTime/audio ]; then cp -R StoryTime/audio _site/StoryTime/audio; fi
          touch _site/.nojekyll

      - name: Assert private files are absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e _site/.env
          test ! -e _site/pass.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
