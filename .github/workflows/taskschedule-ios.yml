name: Build Task & Schedule iOS app

on:
  push:
    branches: [main]
    paths:
      - "TaskSchedule/**"
      - "TaskSchedule-iOS/**"
      - ".github/workflows/taskschedule-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taskschedule-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: TaskSchedule-iOS
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bundle the web app
        run: bash scripts/prepare.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild build \
            -project TaskSchedule.xcodeproj \
            -scheme TaskSchedule \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"

      - name: Package IPA
        run: |
          set -euo pipefail
          app=build/DerivedData/Build/Products/Release-iphoneos/TaskSchedule.app
          test -d "$app/PlugIns/TaskScheduleWidget.appex"
          # Ad-hoc signatures carry the App Group entitlement, so sideloading tools re-sign with it.
          codesign --force --sign - --entitlements Widget/TaskScheduleWidget.entitlements "$app/PlugIns/TaskScheduleWidget.appex"
          codesign --force --sign - --entitlements App/TaskSchedule.entitlements "$app"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry ../TaskSchedule.ipa Payload)
          ls -lh build/TaskSchedule.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskSchedule-ipa
          path: TaskSchedule-iOS/build/TaskSchedule.ipa
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: TaskSchedule-iOS/build/xcodebuild.log

      - name: Publish to the Task & Schedule iOS release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=taskschedule-ios
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Task & Schedule for iOS" --notes "Unsigned IPA of Task & Schedule with Home Screen and Lock Screen widgets and native notifications. Install it with AltStore, SideStore or Sideloadly. Rebuilt automatically on every change." --latest=false
          fi
          gh release upload "$tag" build/TaskSchedule.ipa --clobber
