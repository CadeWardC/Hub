<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paypers</title>
  <link rel="stylesheet" href="styles.css?v=14" />
</head>
<body>
  <div id="app">
    <!-- Onboarding -->
    <section id="onboarding" class="view active">
      <div class="onboarding-content">
        <h1>Paypers</h1>
        <p class="subtitle">Discover biomedical research tailored to you.</p>

        <div class="section">
          <h2>What are you interested in?</h2>
          <div class="keyword-input-wrap">
            <input type="text" id="keyword-input" placeholder="Type a keyword and press Enter" maxlength="40" autocomplete="off" />
            <button id="add-keyword">Add</button>
          </div>
          <div id="selected-keywords" class="keywords-list"></div>
          <p id="keyword-limit" class="hint hidden">You can add up to 5 keywords.</p>
        </div>

        <div class="section">
          <h3>Or pick from hot topics</h3>
          <div id="topic-pills" class="pills"></div>
        </div>

        <button id="start-btn" class="primary-btn" disabled>Start Discovering</button>
      </div>
    </section>

    <!-- Main App -->
    <section id="main" class="view">
      <header class="top-bar">
        <div class="logo">Paypers</div>
        <div class="top-bar-actions">
          <div id="stats-bar" class="stats-bar"></div>
          <button id="settings-btn" class="dark-toggle" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: auto;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
          <button id="dark-toggle" class="dark-toggle" title="Toggle dark mode"></button>
        </div>
      </header>

      <!-- Digest Banner -->
      <div id="digest-banner" class="digest-banner hidden"></div>

      <div class="main-body">
        <!-- Swipe Tab -->
        <div id="tab-swipe" class="tab-content active">
          <div class="card-area">
            <div id="card-stack" class="card-stack">
              <div id="empty-state" class="empty-state hidden">
                <div class="loading-spinner"></div>
                <p id="empty-state-msg">Loading more papers…</p>
                <button id="retry-btn" class="retry-btn hidden">Retry</button>
              </div>
            </div>

            <div class="swipe-controls">
              <button id="swipe-btn-undo" class="control-btn undo hidden" title="Undo last swipe">
                <span class="btn-icon">
                  <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: auto;"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                </span>
              </button>
              <button id="swipe-btn-dislike" class="control-btn dislike" title="Not interested (Swipe Left)">
                <span class="btn-icon">
                  <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: auto;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </span>
              </button>
              <button id="swipe-btn-like" class="control-btn like" title="Save &amp; Boost (Swipe Right)">
                <span class="btn-icon">
                  <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: auto;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                </span>
              </button>
              <button id="swipe-btn-similar" class="control-btn similar" title="Find Similar Papers">
                <span class="btn-icon">
                  <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: auto;"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-.877a.5.5 0 0 1 0-.972l6.135-.877A2 2 0 0 0 8.5 9.937l.877-6.135a.5.5 0 0 1 .972 0l.877 6.135A2 2 0 0 0 12.688 11.3l6.135.877a.5.5 0 0 1 0 .972l-6.135.877a2 2 0 0 0-1.425 1.437l-.877 6.135a.5.5 0 0 1-.972 0l-.877-6.135z"></path><path d="M20 3v4M18 5h4M5 20v2M4 21h2"></path></svg>
                </span>
              </button>
            </div>
          </div>
        </div>

        <!-- Skipped Tab -->
        <div id="tab-skipped" class="tab-content">
          <div class="saved-header">
            <h2>Skipped Papers</h2>
            <p id="skipped-subtitle" class="saved-subtitle">No papers skipped yet.</p>
            <div class="saved-header-row">
              <input type="text" id="skipped-filter" class="saved-filter hidden" placeholder="Filter skipped papers…" />
              <select id="skipped-sort-select" class="saved-sort-select hidden">
                <option value="recent">Recently Skipped</option>
                <option value="cited">Most Cited</option>
                <option value="year">Published Year</option>
              </select>
            </div>
          </div>
          <div id="skipped-list" class="saved-list"></div>
        </div>

        <!-- Saved Tab -->
        <div id="tab-saved" class="tab-content">
          <div class="saved-header">
            <h2>Saved Papers</h2>
            <p id="saved-subtitle" class="saved-subtitle">No papers saved yet.</p>
            <div class="saved-header-row">
              <input type="text" id="saved-filter" class="saved-filter hidden" placeholder="Filter saved papers…" />
              <select id="saved-sort-select" class="saved-sort-select hidden">
                <option value="recent">Recently Saved</option>
                <option value="cited">Most Cited</option>
                <option value="year">Published Year</option>
              </select>
              <button id="undo-save-btn" class="undo-save-btn hidden">Undo last save</button>
            </div>
          </div>
          <div id="saved-list" class="saved-list"></div>
        </div>
      </div>

      <!-- Bottom Tabs -->
      <nav class="bottom-tabs">
        <button id="tab-btn-skipped" class="tab-btn" data-tab="skipped">
          <span class="tab-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: auto;"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
          </span>
          <span class="tab-label">Skipped</span>
          <span id="skipped-badge" class="tab-badge" style="display: none;">0</span>
        </button>
        <button id="tab-btn-swipe" class="tab-btn active" data-tab="swipe">
          <span class="tab-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: auto;"><rect x="3" y="9" width="14" height="12" rx="2" ry="2"></rect><path d="M7 5H19a2 2 0 0 1 2 2v10"></path></svg>
          </span>
          <span class="tab-label">Swipe</span>
        </button>
        <button id="tab-btn-saved" class="tab-btn" data-tab="saved">
          <span class="tab-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: auto;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </span>
          <span class="tab-label">Saved</span>
          <span id="saved-badge" class="tab-badge">0</span>
        </button>
      </nav>
    </section>
  </div>

  <script src="app.js?v=14"></script>
</body>
</html>
