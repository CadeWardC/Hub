# XcodeGen spec: run `xcodegen generate` to make ToneTalk.xcodeproj.
name: ToneTalk
options:
  bundleIdPrefix: com.cadeward
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  ToneKit:
    path: ToneKit
targets:
  ToneTalk:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: App
    dependencies:
      - package: ToneKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ToneTalk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: ToneTalk listens to your Mandarin so it can reply and check your tones.
        NSSpeechRecognitionUsageDescription: ToneTalk turns your spoken Mandarin into text.
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadeward.tonetalk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
