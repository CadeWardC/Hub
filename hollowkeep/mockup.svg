<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" shape-rendering="crispEdges" font-family="Segoe UI, Roboto, sans-serif">
  <title>Hollowkeep mockup: night 3, wave from the east</title>
  <defs>
    <pattern id="grass" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#6b8a3a"/>
      <rect x="4" y="6" width="4" height="4" fill="#8fa850"/>
      <rect x="20" y="18" width="4" height="4" fill="#5f7d33"/>
      <rect x="14" y="26" width="4" height="4" fill="#8fa850"/>
      <rect x="0" y="0" width="32" height="1" fill="#5f7d33" opacity=".5"/>
      <rect x="0" y="0" width="1" height="32" fill="#5f7d33" opacity=".5"/>
    </pattern>
    <pattern id="rock" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#6f6a64"/>
      <rect x="6" y="4" width="4" height="4" fill="#8d877e"/>
      <rect x="22" y="14" width="4" height="4" fill="#5b5752"/>
      <rect x="10" y="22" width="4" height="4" fill="#8d877e"/>
    </pattern>
    <pattern id="ore" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="url(#rock)"/>
      <rect x="14" y="8" width="4" height="4" fill="#d4a84b"/>
      <rect x="4" y="20" width="4" height="4" fill="#f0d77a"/>
    </pattern>
    <pattern id="farm" width="32" height="12" patternUnits="userSpaceOnUse">
      <rect width="32" height="12" fill="#7d6a3a"/>
      <rect y="0" width="32" height="4" fill="#8fa850"/>
    </pattern>
    <pattern id="corrupt" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#4a2a55"/>
      <rect x="8" y="10" width="4" height="4" fill="#6d3a7a"/>
      <rect x="22" y="22" width="4" height="4" fill="#b35bc4" opacity=".7"/>
    </pattern>
    <radialGradient id="warm">
      <stop offset="0" stop-color="#f6c36a" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#f2a03d" stop-opacity=".3"/>
      <stop offset="1" stop-color="#f2a03d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet">
      <stop offset="0" stop-color="#d27ae3" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b35bc4" stop-opacity="0"/>
    </radialGradient>
    <g id="tree">
      <rect x="-3" y="4" width="6" height="8" fill="#4b3322"/>
      <circle r="13" fill="#3e6035" shape-rendering="auto"/>
      <circle cx="-4" cy="-4" r="6" fill="#5a7f43" shape-rendering="auto"/>
    </g>
    <g id="villager">
      <rect x="-5" y="-22" width="10" height="8" fill="#f2d4b0" stroke="#1b1a24" stroke-width="2"/>
      <rect x="-7" y="-14" width="14" height="12" fill="#c9c2a8" stroke="#1b1a24" stroke-width="2"/>
    </g>
    <g id="guard">
      <rect x="-5" y="-22" width="10" height="8" fill="#f2d4b0" stroke="#1b1a24" stroke-width="2"/>
      <rect x="-7" y="-14" width="14" height="12" fill="#4f8e96" stroke="#1b1a24" stroke-width="2"/>
      <rect x="7" y="-24" width="2" height="18" fill="#b07d4f"/>
    </g>
    <g id="monster">
      <ellipse rx="15" ry="12" fill="#6d3a7a" stroke="#1b1a24" stroke-width="3" shape-rendering="auto"/>
      <rect x="-8" y="-10" width="4" height="8" fill="#6d3a7a" stroke="#1b1a24" stroke-width="2"/>
      <rect x="-7" y="-3" width="4" height="4" fill="#ff5a4a"/>
      <rect x="3" y="-3" width="4" height="4" fill="#ff5a4a"/>
    </g>
    <g id="house">
      <rect x="-22" y="-14" width="44" height="30" fill="#8a5a36" stroke="#1b1a24" stroke-width="3"/>
      <polygon points="-28,-12 0,-34 28,-12" fill="#b07d4f" stroke="#1b1a24" stroke-width="3" shape-rendering="auto"/>
      <rect x="-5" y="2" width="10" height="14" fill="#1b1a24"/>
      <rect x="10" y="-6" width="6" height="6" fill="#f6d365"/>
    </g>
    <g id="tower">
      <rect x="-18" y="-40" width="36" height="52" fill="#9a948a" stroke="#1b1a24" stroke-width="3"/>
      <rect x="-22" y="-50" width="44" height="12" fill="#8d877e" stroke="#1b1a24" stroke-width="3"/>
      <rect x="-22" y="-58" width="10" height="8" fill="#8d877e" stroke="#1b1a24" stroke-width="3"/>
      <rect x="-5" y="-58" width="10" height="8" fill="#8d877e" stroke="#1b1a24" stroke-width="3"/>
      <rect x="12" y="-58" width="10" height="8" fill="#8d877e" stroke="#1b1a24" stroke-width="3"/>
      <rect x="-4" y="-30" width="8" height="10" fill="#f2a03d"/>
    </g>
  </defs>

  <!-- terrain -->
  <rect width="1280" height="720" fill="url(#grass)"/>
  <path d="M0 0 H320 V64 H288 V128 H224 V160 H128 V224 H0 Z" fill="#33687d"/>
  <path d="M0 0 H224 V32 H192 V96 H96 V128 H0 Z" fill="#274f66"/>
  <rect x="1024" y="0" width="256" height="720" fill="url(#corrupt)"/>
  <path d="M960 0 H1024 V720 H992 V608 H960 V448 H928 V320 H960 V160 H928 V64 H960 Z" fill="url(#corrupt)" opacity=".8"/>
  <path d="M704 608 H960 V720 H672 V672 H704 Z" fill="url(#rock)"/>
  <rect x="800" y="640" width="96" height="64" fill="url(#ore)"/>
  <g>
    <use href="#tree" x="48" y="300"/><use href="#tree" x="84" y="330"/><use href="#tree" x="40" y="360"/>
    <use href="#tree" x="120" y="300"/><use href="#tree" x="150" y="364"/><use href="#tree" x="96" y="400"/>
    <use href="#tree" x="52" y="440"/><use href="#tree" x="140" y="450"/><use href="#tree" x="200" y="420"/>
    <use href="#tree" x="72" y="510"/><use href="#tree" x="180" y="520"/><use href="#tree" x="240" y="480"/>
    <use href="#tree" x="120" y="580"/><use href="#tree" x="220" y="600"/><use href="#tree" x="40" y="620"/>
    <use href="#tree" x="300" y="560"/><use href="#tree" x="280" y="660"/><use href="#tree" x="160" y="670"/>
  </g>

  <!-- village -->
  <rect x="448" y="224" width="352" height="320" fill="#7a7a48" opacity=".35"/>
  <rect x="480" y="256" width="96" height="72" fill="url(#farm)" stroke="#5a4a2a" stroke-width="2"/>
  <g stroke="#1b1a24" stroke-width="3">
    <rect x="440" y="216" width="368" height="16" fill="#9a948a"/>
    <rect x="440" y="216" width="16" height="336" fill="#9a948a"/>
    <rect x="440" y="536" width="140" height="16" fill="#9a948a"/>
    <rect x="668" y="536" width="140" height="16" fill="#9a948a"/>
    <rect x="792" y="216" width="16" height="130" fill="#9a948a"/>
    <rect x="792" y="370" width="16" height="40" fill="#7d776e"/>
    <rect x="792" y="440" width="16" height="112" fill="#9a948a"/>
  </g>
  <rect x="580" y="538" width="88" height="12" fill="#8a5a36" stroke="#1b1a24" stroke-width="2"/>
  <g>
    <rect x="592" y="328" width="80" height="80" fill="#6f6a64" stroke="#1b1a24" stroke-width="3"/>
    <rect x="584" y="312" width="96" height="20" fill="#8d877e" stroke="#1b1a24" stroke-width="3"/>
    <rect x="620" y="376" width="24" height="32" fill="#1b1a24"/>
    <rect x="604" y="344" width="10" height="12" fill="#f6d365"/><rect x="650" y="344" width="10" height="12" fill="#f6d365"/>
    <rect x="628" y="290" width="4" height="24" fill="#4b3322"/><rect x="632" y="290" width="18" height="10" fill="#f2a03d"/>
  </g>
  <use href="#house" x="520" y="400"/><use href="#house" x="520" y="480"/>
  <use href="#house" x="740" y="290"/><use href="#house" x="720" y="480"/>
  <use href="#tower" x="456" y="240"/><use href="#tower" x="792" y="240"/>
  <use href="#tower" x="456" y="548"/><use href="#tower" x="792" y="548"/>
  <use href="#villager" x="560" y="360"/><use href="#villager" x="700" y="420"/>
  <use href="#villager" x="610" y="450"/><use href="#villager" x="690" y="360"/>
  <use href="#guard" x="776" y="300"/><use href="#guard" x="776" y="470"/><use href="#guard" x="776" y="520"/>

  <!-- the wave -->
  <use href="#monster" x="850" y="392"/><use href="#monster" x="840" y="430"/>
  <use href="#monster" x="900" y="360"/><use href="#monster" x="930" y="450"/>
  <use href="#monster" x="990" y="400"/><use href="#monster" x="1040" y="340"/>
  <use href="#monster" x="1080" y="470"/>
  <circle cx="1150" cy="410" r="70" fill="url(#violet)" shape-rendering="auto"/>
  <polygon points="1150,370 1170,410 1150,450 1130,410" fill="#b35bc4" stroke="#1b1a24" stroke-width="3" shape-rendering="auto"/>

  <!-- night: cold overlay, then warm light pools -->
  <rect width="1280" height="720" fill="#1c2a4a" opacity=".5"/>
  <g style="mix-blend-mode:screen" shape-rendering="auto">
    <circle cx="632" cy="360" r="150" fill="url(#warm)"/>
    <circle cx="792" cy="210" r="110" fill="url(#warm)"/>
    <circle cx="792" cy="520" r="110" fill="url(#warm)"/>
    <circle cx="456" cy="210" r="90" fill="url(#warm)"/>
    <circle cx="456" cy="520" r="90" fill="url(#warm)"/>
    <circle cx="1150" cy="410" r="110" fill="url(#violet)"/>
  </g>
  <g stroke="#f6d365" stroke-width="3" shape-rendering="auto">
    <line x1="792" y1="200" x2="892" y2="356"/><line x1="792" y1="508" x2="836" y2="432"/>
  </g>
  <g fill="#ff5a4a" shape-rendering="auto"><circle cx="846" cy="390" r="3"/><circle cx="856" cy="390" r="3"/></g>

  <!-- HUD -->
  <g font-size="20" fill="#ece6d6">
    <rect x="16" y="16" width="380" height="52" rx="6" fill="#262431" fill-opacity=".9" stroke="#3b3848" stroke-width="2" shape-rendering="auto"/>
    <rect x="32" y="32" width="18" height="18" fill="#b07d4f"/><text x="58" y="49">42</text>
    <rect x="104" y="32" width="18" height="18" fill="#8d877e"/><text x="130" y="49" fill="#f6d365">7</text>
    <rect x="164" y="32" width="18" height="18" fill="#8fa850"/><text x="190" y="49">31</text>
    <rect x="236" y="32" width="18" height="18" fill="#d4a84b"/><text x="262" y="49">3</text>
    <rect x="296" y="32" width="18" height="18" fill="#c9c2a8"/><text x="322" y="49">11</text>

    <rect x="520" y="16" width="240" height="52" rx="6" fill="#262431" fill-opacity=".9" stroke="#c23b3b" stroke-width="2" shape-rendering="auto"/>
    <text x="540" y="49">Night 3 · 01:12</text>
    <text x="700" y="49" fill="#ff7a6a" font-weight="bold">EAST</text>

    <rect x="928" y="16" width="336" height="68" rx="6" fill="#262431" fill-opacity=".9" stroke="#3b3848" stroke-width="2" shape-rendering="auto"/>
    <g font-size="20" text-anchor="middle">
      <rect x="938" y="26" width="60" height="48" rx="6" fill="#34313f" stroke="#3b3848" stroke-width="2"/><text x="968" y="57">II</text>
      <rect x="1004" y="26" width="60" height="48" rx="6" fill="#7a4d16" stroke="#f2a03d" stroke-width="2"/><text x="1034" y="57" fill="#f2a03d">1x</text>
      <rect x="1070" y="26" width="60" height="48" rx="6" fill="#34313f" stroke="#3b3848" stroke-width="2"/><text x="1100" y="57">2x</text>
      <rect x="1136" y="26" width="60" height="48" rx="6" fill="#34313f" stroke="#3b3848" stroke-width="2"/><text x="1166" y="57">3x</text>
      <rect x="1202" y="26" width="52" height="48" rx="6" fill="#34313f" stroke="#3b3848" stroke-width="2"/><text x="1228" y="57">≡</text>
    </g>

    <rect x="16" y="624" width="420" height="80" rx="6" fill="#262431" fill-opacity=".92" stroke="#c23b3b" stroke-width="2" shape-rendering="auto"/>
    <text x="32" y="656" fill="#ff7a6a" font-weight="bold">East wall 2/6: breach soon</text>
    <text x="32" y="686" font-size="17" fill="#a39d92">Tap to jump · long-press to place emergency palisade</text>

    <circle cx="1196" cy="636" r="52" fill="#7a4d16" stroke="#f2a03d" stroke-width="3" shape-rendering="auto"/>
    <text x="1196" y="644" text-anchor="middle" font-size="22" fill="#ece6d6">Build</text>
    <circle cx="1084" cy="664" r="34" fill="#34313f" stroke="#3b3848" stroke-width="3" shape-rendering="auto"/>
    <text x="1084" y="671" text-anchor="middle" font-size="16">Bell</text>
  </g>
</svg>
